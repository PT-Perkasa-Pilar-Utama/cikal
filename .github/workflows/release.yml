name: Release

# Tag vX.Y.Z membangun image rilis sekali; digest yang sama dipasang di SIT, UAT, lalu production (DEPLOYMENT_PLAN §4.1).
# Image cikal-api memuat modul manifest POC dan mempercayai kunci lisensi PPU saja (technical-specs 07 §7.6).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pt-perkasa-pilar-utama
  MANIFEST: deploy/manifests/poc.json
  LICENSE_KEY: deploy/license/ppu-license-public-key.pem

jobs:
  image:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: cikal-api
            dockerfile: apps/api/Dockerfile
            suffix: -poc
          - image: cikal-web
            dockerfile: apps/web/Dockerfile
            suffix: -poc
          - image: cikal-postgres
            dockerfile: deploy/postgres/Dockerfile
            suffix: ""
    steps:
      - uses: actions/checkout@v7
      - name: Tag
        id: tag
        run: |
          if [ "${{ matrix.image }}" = "cikal-postgres" ]; then
            echo "tag=17.6" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the PPU license key
        if: matrix.image == 'cikal-api'
        run: test -f "$LICENSE_KEY" || { echo "::error::$LICENSE_KEY is missing (DEPLOYMENT_PLAN §3.11)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          build-args: |
            MANIFEST=${{ env.MANIFEST }}
            LICENSE_KEY=${{ env.LICENSE_KEY }}
      - name: Digest
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
