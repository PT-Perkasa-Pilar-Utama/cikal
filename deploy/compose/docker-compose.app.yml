# Production VM aplikasi (DEPLOYMENT_PLAN §2.1, §2.2). Database dan storage di VM data lewat jaringan privat;
# alamatnya di .env (deploy/compose/env/production-app.env.example). Tidak ada reset dan akun seed di production.
name: cikal

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

x-app: &app
  image: ${CIKAL_API_IMAGE:?set CIKAL_API_IMAGE in .env}
  env_file: .env
  logging: *logging
  restart: unless-stopped
  secrets: [cikal_master_key, s3_access_key, s3_secret_key, monitoring_token, smtp_password, oksara_key]
  volumes:
    - ./license.json:/etc/cikal/license.json:ro

services:
  nginx:
    image: ${CIKAL_WEB_IMAGE:?set CIKAL_WEB_IMAGE in .env}
    logging: *logging
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      STORAGE_UPSTREAM: ${STORAGE_UPSTREAM:?set STORAGE_UPSTREAM in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/cikal:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    environment:
      PROCESS_ROLE: api
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on: &app-depends
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started

  worker:
    <<: *app
    command: ["dist/worker.js"]
    environment:
      PROCESS_ROLE: worker
    depends_on: *app-depends

  # Runner platform/migrate sekali jalan: `docker compose run --rm migrate create-admin ...` mengganti perintahnya.
  migrate:
    <<: *app
    restart: "no"
    entrypoint: ["/nodejs/bin/node", "dist/platform/migrate/run.js"]
    command: ["migrate"]

  gotenberg:
    image: gotenberg/gotenberg:8.20.1
    logging: *logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v3.3.0
    profiles: [tools]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

secrets:
  cikal_master_key: { file: ./secrets/cikal_master_key }
  s3_access_key: { file: ./secrets/s3_access_key }
  s3_secret_key: { file: ./secrets/s3_secret_key }
  monitoring_token: { file: ./secrets/monitoring_token }
  smtp_password: { file: ./secrets/smtp_password }
  oksara_key: { file: ./secrets/oksara_key }
